name: Phase 16 optimizer dashboard

on:
  push:
    branches:
      - phase-16-optimizer-dashboard
  workflow_dispatch:

jobs:
  test-phase16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Phase 15 and 16 modules
        run: python -m py_compile backtest_engine.py strategy_optimizer.py optimizer_dashboard.py pages/3_⚙️_Strategy_Optimizer.py
      - name: Run Phase 15 and 16 tests
        run: python -m pytest -q tests/test_phase14_backtest.py tests/test_phase15_optimizer.py tests/test_phase16_optimizer_dashboard.py
