name: Strategy V2 validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "strategy_v2.py"
      - "research/strategy_v2_replay.py"
      - "research/strategy_v2_entry_diagnostics.py"
      - "tests/test_strategy_v2.py"
      - "tests/test_strategy_v2_replay.py"
      - "tests/test_strategy_v2_pullback.py"
      - ".github/workflows/strategy-v2-validation.yml"
  push:
    branches:
      - "strategy-v2-entry-diagnostics-2026-09-12"
      - "strategy-v2-reclaim-window-2026-09-12"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  strategy-v2-paper-parity:
    name: Strategy V2 paper-parity replay
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test Strategy V2
        run: >-
          python -m pytest -q
          tests/test_strategy_v2.py
          tests/test_strategy_v2_replay.py
          tests/test_strategy_v2_pullback.py
          && python -m py_compile strategy_v2.py research/strategy_v2_replay.py research/strategy_v2_entry_diagnostics.py
      - name: Download one-minute V2 dataset
        run: >-
          python -m research.run_step2b
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --interval 1m
          --max-assets 10
          --output data/historical
      - name: Validate dataset manifest
        run: >-
          python -c "import json; m=json.load(open('data/historical/manifest.json')); assert m['status']=='DATASET_READY'; assert m['interval']=='1m'; assert len(m['symbols'])==10; assert all(x['candles']>10000 for x in m['files']); print(json.dumps(m, indent=2))"
      - name: Run Strategy V2 paper-parity replay
        run: >-
          python -m research.strategy_v2_replay
          --data data/historical
          --output strategy-v2-results
      - name: Validate Strategy V2 replay report
        run: >-
          python -c "import json; r=json.load(open('strategy-v2-results/strategy_v2_report.json')); assert r['status']=='EXECUTION_COMPLETE'; assert r['procedure']=='strategy_v2_event_replay'; assert r['strategy']=='V2'; assert r['robustness_policy']=='unchanged'; assert r['diagnostics']['opened_trades']==r['result']['closed_trades'] + r['diagnostics']['opened_trades']-r['result']['closed_trades']; print(json.dumps(r, indent=2))"
      - name: Run Strategy V2 entry funnel diagnostics
        run: >-
          python -m research.strategy_v2_entry_diagnostics
          --data data/historical
          --output strategy-v2-entry-diagnostics
      - name: Validate diagnostic report
        run: >-
          python -c "import json; r=json.load(open('strategy-v2-entry-diagnostics/strategy_v2_entry_diagnostics.json')); assert r['status']=='EXECUTION_COMPLETE'; assert r['procedure']=='strategy_v2_entry_gate_diagnostics'; assert r['sampling']['required_mtf_history']==50; assert r['parity']['failures']==0; print(json.dumps(r, indent=2))"
      - name: Upload Strategy V2 results
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v2-results
          path: strategy-v2-results/
      - name: Upload Strategy V2 entry diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v2-entry-diagnostics
          path: strategy-v2-entry-diagnostics/
