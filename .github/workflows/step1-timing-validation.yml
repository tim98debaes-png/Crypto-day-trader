name: Step 1 Timing Validation

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/pre-stabilization-2026-08-30

jobs:
  timing-contract:
    name: Step 1 timing contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Step 1 timing tests
        run: python -m pytest -q tests/test_step1_timing_contract.py
