name: Step 1 timing validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/step1/**'
      - 'research/step1/**'
  pull_request:
    paths:
      - 'backtest_engine.py'
      - 'tests/test_step1_timing_contract.py'
      - '.github/workflows/step1-timing-validation.yml'

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  step1-timing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Step 1 timing contract tests
        run: python -m pytest -q tests/test_step1_timing_contract.py
