name: Inject Phase 5 paper signals

on:
  push:
    branches:
      - phase-5-paper-trading-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply narrow app injection
        run: python scripts/integrate_paper_signals.py

      - name: Compile patched app
        run: python -m py_compile app.py signal_engine.py paper_router.py

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No app changes required."
          else
            git add app.py
            git commit -m "Phase 5: inject validated paper signals into app"
            git push
          fi
