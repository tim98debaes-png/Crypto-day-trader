name: Phase 30 final validation

on:
  push:
    branches:
      - phase-30-final-validation
  pull_request:
    branches:
      - phase-29-production-hardening
      - phase-30-final-validation

jobs:
  final-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Compile complete safety stack
        run: python -m py_compile final_validation.py production_readiness.py operational_hardening.py exchange_sandbox.py durable_order_ledger.py order_reconciliation.py live_execution_contract.py live_order_lifecycle.py prelive_safety_gate.py phase27_e2e.py phase23_reliability.py paper_session_observability.py paper_execution.py paper_session_monitor.py paper_engine.py candidate_registry.py
      - name: Full regression suite
        run: python -m pytest -q tests/test_phase30_final_validation.py tests/test_phase29_readiness.py tests/test_phase28_exchange_sandbox.py tests/test_phase28_lifecycle_integration.py tests/test_phase27_e2e.py tests/test_phase26_durable_ledger.py tests/test_phase26_reconciliation.py tests/test_phase25_live_contract.py tests/test_phase25_order_lifecycle.py tests/test_phase24_safety_gate.py tests/test_phase23_reliability.py tests/test_phase22_observability.py tests/test_phase22_dashboard.py tests/test_phase22_end_to_end.py tests/test_phase21_monitoring.py tests/test_phase21_execution_integration.py tests/test_candidate_registry.py tests/test_active_candidate_source.py tests/test_paper_registry_router.py
      - name: Final no-go policy
        run: python -c "from final_validation import final_validation; r=final_validation({'ci_green':True,'paper_validation_green':True,'safety_gate_green':True,'reconciliation_green':True,'sandbox_green':True,'operational_hardening_green':True,'secrets_absent':True,'live_disabled':True}); assert r.go, r.blockers"
