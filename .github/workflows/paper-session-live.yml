name: Bounded live-data paper session

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  paper-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bounded live-market-data paper session
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from candidate_registry import CandidateRegistry
          from paper_engine import PaperAccount
          from paper_execution import PaperExecutionLoop
          from phase34_paper_session import run_bounded_paper_session

          with tempfile.TemporaryDirectory() as tmp:
              registry = CandidateRegistry(Path(tmp) / "registry.json")
              candidate = {
                  "Status": "ROBUST",
                  "Stability": 75,
                  "OOS PF": 1.5,
                  "OOS %": 12,
                  "OOS trades": 20,
                  "OOS DD": -8,
                  "MC P05 %": -2,
                  "Direction": "LONG",
                  "RR": 2.0,
                  "symbol": "BTCUSDT",
              }
              candidate_id = registry.register(candidate)
              decision = registry.promote(candidate_id, human_approved=True)
              if not decision.approved:
                  raise SystemExit(f"candidate promotion failed: {decision.reason}")

              account = PaperAccount(capital=1000.0, fee_pct=0.0, slippage_pct=0.0)
              loop = PaperExecutionLoop(account, registry=registry, persist_observability=False)
              result = run_bounded_paper_session(
                  symbol="BTCUSDT",
                  duration_seconds=900,
                  interval_seconds=15,
                  capital=1000.0,
                  loop=loop,
              )
              payload = {
                  "symbol": result.symbol,
                  "samples": result.samples,
                  "last_price": result.last_price,
                  "errors": result.errors,
                  "summary": result.summary,
              }
              Path("paper_session_result.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
              print(json.dumps(payload, indent=2))
          PY

      - name: Upload paper session result
        uses: actions/upload-artifact@v4
        with:
          name: bounded-live-paper-session
          path: paper_session_result.json
          if-no-files-found: error
