name: Bounded live-data paper session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Paper-session duration in minutes (1-720)"
        required: false
        default: "15"
      fee_pct:
        description: "Research execution fee percentage per side"
        required: false
        default: "0.10"
      slippage_pct:
        description: "Research execution slippage percentage per side"
        required: false
        default: "0.02"

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  paper-session:
    runs-on: ubuntu-latest
    timeout-minutes: 750
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run public feed diagnostic with failover
        run: |
          python - <<'PY'
          import json, traceback
          from coinbase_public_feed import CoinbasePublicFeed
          from market_feed import BinancePublicFeed
          from market_feed_failover import PublicFeedFailover
          feed = PublicFeedFailover([
              ("binance", BinancePublicFeed(timeout=10)),
              ("coinbase", CoinbasePublicFeed(timeout=10)),
          ])
          result = {"symbol": "BTCUSDT", "ok": False}
          try:
              snapshot = feed.snapshot("BTCUSDT")
              result.update({"ok": True, "provider": feed.last_provider,
                             "price": snapshot.price, "timestamp": snapshot.timestamp,
                             "failures_before_success": [f.__dict__ for f in feed.failures]})
          except Exception as exc:
              result.update({"error_type": type(exc).__name__, "error": str(exc),
                             "failures": [f.__dict__ for f in feed.failures],
                             "traceback": traceback.format_exc()})
          print(json.dumps(result, indent=2))
          with open("feed_diagnostic.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, indent=2)
          if not result["ok"]:
              raise SystemExit("all public market feeds failed")
          PY

      - name: Run bounded 50-asset live-market-data paper session
        env:
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '15' }}
          FEE_PCT: ${{ github.event.inputs.fee_pct || '0.10' }}
          SLIPPAGE_PCT: ${{ github.event.inputs.slippage_pct || '0.02' }}
        run: |
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          from candidate_registry import CandidateRegistry
          from paper_engine import PaperAccount
          from paper_execution import PaperExecutionLoop
          from multi_asset_live_paper_session import run_multi_asset_paper_session
          from coinbase_public_feed import CoinbasePublicFeed
          from market_feed import BinancePublicFeed
          from market_feed_failover import PublicFeedFailover

          duration_minutes = int(os.environ.get("DURATION_MINUTES", "15"))
          fee_pct = float(os.environ.get("FEE_PCT", "0.10"))
          slippage_pct = float(os.environ.get("SLIPPAGE_PCT", "0.02"))
          if not 1 <= duration_minutes <= 720:
              raise SystemExit("duration_minutes must be between 1 and 720")
          if fee_pct < 0 or slippage_pct < 0:
              raise SystemExit("fee_pct and slippage_pct must be non-negative")

          with tempfile.TemporaryDirectory() as tmp:
              registry = CandidateRegistry(Path(tmp) / "registry.json")
              candidate = {"Status": "ROBUST", "Stability": 75, "OOS PF": 1.5,
                           "OOS %": 12, "OOS trades": 20, "OOS DD": -8, "MC P05 %": -2,
                           "Direction": "LONG", "RR": 2.0}
              candidate_id = registry.register(candidate)
              decision = registry.promote(candidate_id, human_approved=True)
              if not decision.approved:
                  raise SystemExit(f"candidate promotion failed: {decision.reason}")

              account = PaperAccount(capital=1000.0, fee_pct=fee_pct, slippage_pct=slippage_pct)
              loop = PaperExecutionLoop(account, registry=registry, persist_observability=False)
              feed = PublicFeedFailover([
                  ("binance", BinancePublicFeed(timeout=10)),
                  ("coinbase", CoinbasePublicFeed(timeout=10)),
              ])
              result = run_multi_asset_paper_session(
                  feed=feed, loop=loop, duration_seconds=duration_minutes * 60,
                  interval_seconds=30,
              )
              git_sha = os.environ.get("GITHUB_SHA")
              audit_events = list(account.audit_log)
              closed_audits = [e for e in audit_events if e.get("event") == "CLOSE"]
              execution_audit = {
                  "trades_closed": len(closed_audits),
                  "sl_trades": sum(e.get("reason") == "SL" for e in closed_audits),
                  "tp_trades": sum(e.get("reason") == "TP" for e in closed_audits),
                  "signal_trades": sum(e.get("reason") == "SIGNAL" for e in closed_audits),
                  "time_stop_trades": sum(e.get("reason") == "TIME_STOP" for e in closed_audits),
                  "avg_risk_to_actual_ratio": (sum(float(e.get("risk_to_actual_ratio", 0.0)) for e in closed_audits) / len(closed_audits)) if closed_audits else None,
                  "max_risk_to_actual_ratio": max((float(e.get("risk_to_actual_ratio", 0.0)) for e in closed_audits), default=None),
                  "avg_stop_gap_pct": (sum(float(e.get("stop_gap_pct", 0.0)) for e in closed_audits) / len(closed_audits)) if closed_audits else None,
                  "max_stop_gap_pct": max((float(e.get("stop_gap_pct", 0.0)) for e in closed_audits), default=None),
                  "intended_risk_total": sum(float(e.get("intended_risk_amount", 0.0)) for e in closed_audits),
                  "actual_loss_total": sum(float(e.get("actual_loss_amount", 0.0)) for e in closed_audits),
                  "trades": closed_audits,
              }
              payload = {
                  "run_metadata": {"github_sha": git_sha, "github_run_id": os.environ.get("GITHUB_RUN_ID"), "github_run_number": os.environ.get("GITHUB_RUN_NUMBER"), "duration_minutes": duration_minutes},
                  "universe_size": result.universe_size,
                  "scan_cycles": result.scan_cycles,
                  "successful_snapshots": result.successful_snapshots,
                  "feed_errors": result.feed_errors,
                  "candidate_symbols": list(result.candidate_symbols),
                  "provider": feed.last_provider,
                  "fee_pct_per_side": fee_pct,
                  "slippage_pct_per_side": slippage_pct,
                  "feed_failures": [f.__dict__ for f in feed.failures],
                  "summary": result.summary,
                  "diagnostics": result.diagnostics,
                  "execution_audit": execution_audit,
              }
              Path("paper_session_result.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
              Path("execution_audit.json").write_text(json.dumps(execution_audit, indent=2), encoding="utf-8")
              print(json.dumps(payload, indent=2))
          PY

      - name: Upload diagnostics and paper session result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-live-paper-session
          path: |
            feed_diagnostic.json
            paper_session_result.json
            execution_audit.json
          if-no-files-found: warn
