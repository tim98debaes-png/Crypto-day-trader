name: Phase 20 active candidate gate

on:
  push:
    branches:
      - phase-20-active-candidate-paper
  pull_request:
    branches:
      - phase-20-active-candidate-paper

jobs:
  test-active-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile active_candidate_source.py candidate_registry.py candidate_promotion.py paper_router.py
      - run: python -m pytest -q tests/test_candidate_registry.py tests/test_candidate_dashboard.py tests/test_active_candidate_source.py
