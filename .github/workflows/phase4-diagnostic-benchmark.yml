name: Phase 4 diagnostic A-B-C benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "research/**"
      - "tests/test_phase4_*.py"
      - ".github/workflows/phase4-diagnostic-benchmark.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  phase4-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Phase 4 tests
        run: python -m pytest -q tests/test_phase4_*.py
      - name: Download diagnostic dataset
        run: >-
          python -m research.run_step2b
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --interval 5m
          --max-assets 10
          --output data/historical
      - name: Validate dataset
        run: >-
          python -c "import json; m=json.load(open('data/historical/manifest.json')); assert m['status']=='DATASET_READY'; assert len(m['symbols'])==10; assert all(x['candles']>250 for x in m['files']); print('dataset ok')"
      - name: Run trade-level A-B-C diagnosis
        run: >-
          python -m research.phase4_benchmark_export
          --data data/historical
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --output phase4-results
      - name: Validate diagnostic artifacts
        run: >-
          python -c "import json; from pathlib import Path; r=json.load(open('phase4-results/phase4_report.json')); assert r['status']=='DIAGNOSTIC_EXECUTION_COMPLETE'; assert set(r['strategies'])=={'A','B','C'}; [assertion for assertion in [Path(f'phase4-results/{s}/trades.json').exists() and Path(f'phase4-results/{s}/diagnosis.json').exists() and Path(f'phase4-results/{s}/equity_curve.json').exists() for s in 'ABC'] if not assertion] and (_ for _ in ()).throw(AssertionError('missing diagnostic artifact')); print('diagnostic artifacts ok')"
      - name: Upload Phase 4 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase4-ab-c-diagnostics
          path: phase4-results/
