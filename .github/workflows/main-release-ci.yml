name: Main release CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Existing full validation
        run: python -m pytest -q

  step2b-benchmark:
    name: Step 2b A-B-C benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      START: '2026-05-01T00:00:00Z'
      END: '2026-08-01T00:00:00Z'
      MAX_ASSETS: '50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Download historical dataset
        run: python research/run_step2b.py --start "$START" --end "$END" --interval 5m --max-assets "$MAX_ASSETS" --output data/historical
      - name: Run integrated A-B-C benchmark
        run: python -m research.run_step2b_benchmark --data data/historical --start "$START" --end "$END" --output artifacts/step2b
      - name: Validate benchmark report
        run: |
          python -m py_compile research/*.py
          test -s artifacts/step2b/ab_c_report.json
          test -s artifacts/step2b/ab_c_report.csv
      - uses: actions/upload-artifact@v4
        with:
          name: step2b-ab-c-report
          path: artifacts/step2b/
