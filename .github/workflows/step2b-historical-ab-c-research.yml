name: Step 2b Historical A-B-C Research

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Historical start (ISO-8601 UTC)"
        required: true
        default: "2026-05-01T00:00:00Z"
      end:
        description: "Historical end (ISO-8601 UTC)"
        required: true
        default: "2026-08-01T00:00:00Z"
      max_assets:
        description: "Maximum scanner-universe assets"
        required: true
        default: "50"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  historical-ab-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate research modules
        run: >-
          python -m py_compile
          research/historical_data.py research/mtf_features.py
          research/legacy_strategy.py research/hybrid_strategy.py
          research/portfolio_execution.py research/benchmark_runner.py
          research/run_step2b.py research/run_step2b_benchmark.py
          research/step2b_adapters.py research/step2b_validation.py
          research/step2b_walkforward.py research/strategy_adapters.py

      - name: Run Step 2b validation tests
        run: >-
          python -m pytest -q
          tests/test_step2b*.py

      - name: Run historical A-B-C benchmark
        run: >-
          python research/run_step2b_benchmark.py
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"
          --max-assets "${{ inputs.max_assets }}"
          --output artifacts/step2b

      - name: Upload Step 2b report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2b-ab-c-report
          path: artifacts/step2b
          if-no-files-found: warn
