name: Paper trading engine CI

on:
  push:
    branches:
      - phase-5-paper-trading-engine
      - phase-6-paper-persistence
      - phase-7-portfolio-metrics
      - phase-8-dashboard-reporting
      - phase-9-paper-operations
      - phase-10-paper-session-controls
      - phase-11-paper-session-persistence
      - phase-12-alerts
      - phase-13-long-run-runtime
      - phase-14-backtest-engine
      - phase-15-strategy-optimizer
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-paper-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile
        run: python -m py_compile app.py validation_engine.py robustness_engine.py paper_engine.py backtest_engine.py strategy_optimizer.py

      - name: Phase 5 through Phase 14 tests
        run: python -m pytest -q tests/test_phase5_paper_engine.py tests/test_phase5_router.py tests/test_phase4_robustness.py tests/test_phase3_validation.py tests/test_phase14_backtest.py

      - name: Phase 15 tests
        run: python -m pytest -q tests/test_phase15_optimizer.py