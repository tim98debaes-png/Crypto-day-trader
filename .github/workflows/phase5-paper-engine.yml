name: Phase 5 paper trading engine

on:
  push:
    branches:
      - phase-5-paper-trading-engine
  workflow_dispatch:

jobs:
  test-paper-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile
        run: python -m py_compile app.py validation_engine.py robustness_engine.py paper_engine.py

      - name: Phase 5 tests
        run: pytest -q tests/test_phase5_paper_engine.py

      - name: Phase 4 tests
        run: pytest -q tests/test_phase4_robustness.py

      - name: Phase 3 regression tests
        run: pytest -q tests/test_phase3_validation.py
