name: Phase 2c closed-candle patch

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-2-backtest-audit

      - name: Exclude incomplete Binance candle
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old = '''    data["time"] = pd.to_datetime(\n        data["open_time"],\n        unit="ms",\n        utc=True,\n    )\n\n    return (\n        data.sort_values("time")\n'''

          new = '''    data["time"] = pd.to_datetime(\n        data["open_time"],\n        unit="ms",\n        utc=True,\n    )\n\n    # Never feed an unfinished Binance candle into research/backtests.\n    # The candle is considered closed only after close_time has passed.\n    now_ms = int(time.time() * 1000)\n    data["close_time"] = pd.to_numeric(\n        data["close_time"],\n        errors="coerce",\n    )\n    data = data[data["close_time"] <= now_ms]\n\n    return (\n        data.sort_values("time")\n'''

          if old not in text:
              raise SystemExit("Expected fetch() block not found; refusing to patch")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Compile
        run: python -m py_compile app.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Phase 2: exclude incomplete market candles"
          git push origin HEAD:phase-2-backtest-audit
