name: Phase 4 robustness tests

on:
  push:
    branches:
      - phase-4-robustness-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile Phase 4 engine
        run: python -m py_compile robustness_engine.py

      - name: Run Phase 4 tests
        run: python -m pytest -q tests/test_phase4_robustness.py
