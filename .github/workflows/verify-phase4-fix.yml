name: Verify Phase 4 fix

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile application
        run: >-
          python -m py_compile app.py validation_engine.py robustness_engine.py
          paper_engine.py backtest_engine.py strategy_optimizer.py
          paper_execution.py paper_portfolio.py market_feed.py
      - name: Phase 3 validation tests
        run: python -m pytest -q tests/test_phase3_validation.py
      - name: Phase 4 robustness tests
        run: python -m pytest -q tests/test_phase4_robustness.py tests/test_phase4_integration_contract.py
      - name: Backtest and optimizer tests
        run: >-
          python -m pytest -q tests/test_phase14_backtest.py tests/test_phase15_optimizer.py
      - name: Paper engine and portfolio tests
        run: >-
          python -m pytest -q tests/test_phase5_paper_engine.py tests/test_phase5_router.py tests/test_paper_portfolio.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Cleanup
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-phase4-fix.yml
          git commit -m 'Remove temporary Phase 4 verification workflow'
          git push
