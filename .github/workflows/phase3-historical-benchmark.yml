name: Phase 3 historical A-B-C benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/**"
      - "tests/test_phase3_historical_data.py"
      - ".github/workflows/phase3-historical-benchmark.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  phase3-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test historical data client
        run: python -m pytest -q tests/test_phase3_historical_data.py tests/test_step2b_benchmark_schema.py
      - name: Download benchmark dataset
        run: >-
          python -m research.run_step2b
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --interval 5m
          --max-assets 10
          --output data/historical
      - name: Validate dataset manifest
        run: >-
          python -c "import json; m=json.load(open('data/historical/manifest.json')); assert m['status']=='DATASET_READY'; assert len(m['symbols'])==10; assert all(x['candles']>250 for x in m['files']); print(json.dumps(m, indent=2))"
      - name: Run A-B-C benchmark
        run: >-
          python -m research.run_step2b_benchmark
          --data data/historical
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --output benchmark-results
      - name: Validate benchmark report
        run: >-
          python -c "import json; r=json.load(open('benchmark-results/ab_c_report.json')); assert r['status']=='EXECUTION_COMPLETE'; assert set(r['results'])=={'A','B','C'}; print(json.dumps(r, indent=2))"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: phase3-ab-c-benchmark
          path: benchmark-results/
