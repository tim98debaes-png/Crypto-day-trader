name: Phase 17 candidate promotion

on:
  push:
    branches:
      - phase-17-candidate-promotion
  pull_request:
    branches:
      - phase-16-optimizer-dashboard
      - phase-17-candidate-promotion
  workflow_dispatch:

jobs:
  test-phase17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile promotion modules
        run: python -m py_compile paper_router.py strategy_optimizer.py candidate_promotion.py
      - name: Run Phase 15 through 17 tests
        run: python -m pytest -q tests/test_phase14_backtest.py tests/test_phase15_optimizer.py tests/test_phase16_optimizer_dashboard.py tests/test_candidate_promotion.py
