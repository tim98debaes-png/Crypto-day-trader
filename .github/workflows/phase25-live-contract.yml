name: Phase 25 controlled live contract

on:
  push:
    branches:
      - phase-25-controlled-live-architecture
  pull_request:
    branches:
      - phase-24-prelive-safety
      - phase-25-controlled-live-architecture

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile prelive_safety_gate.py live_execution_contract.py live_order_lifecycle.py
      - run: python -m pytest -q tests/test_phase25_live_contract.py tests/test_phase25_order_lifecycle.py tests/test_phase24_safety_gate.py tests/test_phase23_reliability.py tests/test_phase22_observability.py tests/test_phase22_dashboard.py tests/test_phase22_end_to_end.py tests/test_phase21_monitoring.py tests/test_phase21_execution_integration.py tests/test_candidate_registry.py tests/test_active_candidate_source.py tests/test_paper_registry_router.py
