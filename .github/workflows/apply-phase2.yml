name: Apply Phase 2 patch

on:
  push:
    branches:
      - phase-2-backtest-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[phase2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python phase2_apply.py
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Commit Phase 2 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm phase2_apply.py .github/workflows/apply-phase2.yml || true
          git commit -m "Phase 2: fix intrabar trailing-stop lookahead [phase2-applied]"
          git push origin HEAD:phase-2-backtest-audit
