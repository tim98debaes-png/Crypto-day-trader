name: Strategy Research CI

on:
  push:
    branches: [strategy-implementation]
  pull_request:
    branches: [clean-core-2026-09-15, main]

jobs:
  test-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q strategy_trend_breakout.py
      - run: pytest -q tests/test_strategy_trend_breakout.py
