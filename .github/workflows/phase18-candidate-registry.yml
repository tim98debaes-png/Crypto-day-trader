name: Phase 18 candidate registry

on:
  push:
    branches:
      - phase-17-candidate-promotion
      - phase-18-candidate-registry
  pull_request:
    branches:
      - phase-17-candidate-promotion
      - phase-18-candidate-registry

jobs:
  test-candidate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_candidate_registry.py
