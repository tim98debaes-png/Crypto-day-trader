name: Step 2b Historical A-B-C Research

on:
  push:
    paths:
      - '.github/workflows/step2b-research.yml'
  workflow_dispatch:
    inputs:
      start:
        description: UTC start date/time
        required: true
        default: '2026-05-01T00:00:00Z'
      end:
        description: UTC end date/time
        required: true
        default: '2026-08-01T00:00:00Z'
      max_assets:
        description: Maximum scanner-universe assets
        required: true
        default: '50'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      START: ${{ inputs.start || '2026-05-01T00:00:00Z' }}
      END: ${{ inputs.end || '2026-08-01T00:00:00Z' }}
      MAX_ASSETS: ${{ inputs.max_assets || '50' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Download historical dataset
        run: |
          python research/run_step2b.py --start "$START" --end "$END" --interval 5m --max-assets "$MAX_ASSETS" --output data/historical
      - name: Build A/B/C benchmark report
        run: |
          python -m research.run_step2b_benchmark --data data/historical --start "$START" --end "$END" --output artifacts/step2b
      - name: Validate research modules and benchmark output
        run: |
          python -m py_compile research/*.py
          test -s artifacts/step2b/ab_c_report.json
          test -s artifacts/step2b/ab_c_report.csv
          pytest -q tests/test_multi_position_backtest.py
      - name: Upload Step 2b report
        uses: actions/upload-artifact@v4
        with:
          name: step2b-ab-c-report
          path: artifacts/step2b/
