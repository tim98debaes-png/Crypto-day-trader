name: Phase 3 validation engine tests

on:
  push:
    branches:
      - phase-3-validation-engine
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-validation-engine

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Run validation engine tests
        run: python -m pytest -q tests/test_phase3_validation.py
