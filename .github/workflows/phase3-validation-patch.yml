name: Phase 3 validation engine tests

on:
  push:
    branches:
      - phase-3-validation-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-validation-engine
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Apply Phase 3 optimizer integration
        run: python scripts/apply_phase3_patch.py

      - name: Commit optimizer integration when needed
        run: |
          if git diff --quiet; then
            echo "Phase 3 optimizer integration already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Phase 3: wire optimizer to validation engine"
          git push origin HEAD:phase-3-validation-engine

      - name: Run validation engine tests
        run: python -m pytest -q tests/test_phase3_validation.py
