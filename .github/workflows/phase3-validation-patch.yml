name: Phase 3 validation engine patch
on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-validation-engine
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-validation-engine
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Phase 3 patch
        run: python scripts/apply_phase3_patch.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Run Phase 3 tests
        run: python -m pytest -q tests/test_phase3_validation.py
      - name: Commit Phase 3 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/apply_phase3_patch.py tests/test_phase3_validation.py .github/workflows/phase3-validation-patch.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Phase 3: harden walk-forward validation'
            git push origin HEAD:phase-3-validation-engine
          fi
