name: Strategy V3 historical benchmark

on:
  push:
    branches:
      - strategy-v3-framework-2026-09-13
  pull_request:
    branches:
      - main
    paths:
      - "strategy_v3.py"
      - "v3_*.py"
      - "research/strategy_v3_replay.py"
      - "research/strategy_v3_benchmark.py"
      - ".github/workflows/strategy-v3-benchmark.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  historical-benchmark:
    name: V3 vs locked V2 historical benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run framework safety tests
        run: >-
          python -m pytest -q
          tests/test_strategy_v3_framework.py
          tests/test_strategy_v3_replay.py
          tests/test_v3_exit_engine.py
          && python -m py_compile strategy_v3.py v3_portfolio_risk.py v3_trade_forensics.py v3_validation.py v3_exit_engine.py research/strategy_v3_replay.py research/strategy_v3_benchmark.py
      - name: Download benchmark dataset
        run: >-
          python -m research.run_step2b
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --interval 1m
          --max-assets 10
          --output data/historical
      - name: Validate dataset
        run: >-
          python -c "import json; m=json.load(open('data/historical/manifest.json')); assert m['status']=='DATASET_READY'; assert m['interval']=='1m'; assert len(m['symbols'])==10; assert all(x['candles']>10000 for x in m['files']); print(json.dumps(m, indent=2))"
      - name: Run V3 vs V2 benchmark and OOS slices
        run: >-
          python -m research.strategy_v3_benchmark
          --data data/historical
          --output strategy-v3-benchmark
      - name: Validate benchmark report
        run: >-
          python -c "import json, math; r=json.load(open('strategy-v3-benchmark/strategy_v3_benchmark.json')); assert r['status']=='EXECUTION_COMPLETE'; assert r['baseline']=='V2_LOCKED'; assert len(r['oos_fixed_parameter_slices'])>=3; assert all(math.isfinite(float(r['v3'][k])) for k in ('return_pct','max_drawdown_pct','profit_factor','expectancy_per_trade','sharpe_ratio','sortino_ratio','calmar_ratio')); assert 'promotion_gate' in r; print(json.dumps({'v2':r['v2'],'v3':r['v3'],'delta':r['v3_minus_v2'],'promotion_gate':r['promotion_gate'],'oos_folds':len(r['oos_fixed_parameter_slices'])}, indent=2))"
      - name: Upload V3 benchmark
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v3-benchmark
          path: strategy-v3-benchmark/
