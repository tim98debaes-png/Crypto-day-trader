name: Phase 22 paper observability

on:
  push:
    branches:
      - phase-22-sustained-paper-observability-v2
  pull_request:
    branches:
      - phase-21-paper-monitoring-rollback
      - phase-22-sustained-paper-observability-v2

jobs:
  test-paper-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile paper_session_observability.py paper_execution.py paper_session_monitor.py candidate_registry.py
      - run: python -m pytest -q tests/test_phase22_observability.py tests/test_phase21_monitoring.py tests/test_phase21_execution_integration.py tests/test_candidate_registry.py tests/test_active_candidate_source.py tests/test_paper_registry_router.py
