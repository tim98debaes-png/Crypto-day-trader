name: Phase 7 dashboard patch

on:
  push:
    branches:
      - phase-5-paper-trading-engine
    paths:
      - "scripts/apply_phase7_dashboard_patch.py"
      - ".github/workflows/phase7-dashboard-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-5-paper-trading-engine

      - name: Apply dashboard patch
        run: python scripts/apply_phase7_dashboard_patch.py

      - name: Compile patched app
        run: python -m py_compile app.py

      - name: Remove one-time patch tooling
        run: |
          rm -f scripts/apply_phase7_dashboard_patch.py
          rm -f .github/workflows/phase7-dashboard-patch.yml

      - name: Commit dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/apply_phase7_dashboard_patch.py .github/workflows/phase7-dashboard-patch.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Phase 7: upgrade paper dashboard performance view"
          git push origin HEAD:phase-5-paper-trading-engine
