name: Strategy V2 SHORT edge experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - "strategy_v2.py"
      - "research/strategy_v2_replay.py"
      - "tests/test_strategy_v2_short_edge.py"
      - ".github/workflows/strategy-v2-short-edge-experiment.yml"
  push:
    branches:
      - "strategy-v2-short-edge-experiment-2026-09-13"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  benchmark:
    name: Baseline vs SHORT edge replay
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          tests/test_strategy_v2.py
          tests/test_strategy_v2_replay.py
          tests/test_strategy_v2_pullback.py
          tests/test_strategy_v2_replay_safety.py
          tests/test_strategy_v2_short_edge.py
          && python -m py_compile strategy_v2.py research/strategy_v2_replay.py
      - name: Download one-minute experiment dataset
        run: >-
          python -m research.run_step2b
          --start 2026-05-01T00:00:00Z
          --end 2026-08-01T00:00:00Z
          --interval 1m
          --max-assets 10
          --output data/historical
      - name: Validate dataset manifest
        run: >-
          python -c "import json; m=json.load(open('data/historical/manifest.json')); assert m['status']=='DATASET_READY'; assert m['interval']=='1m'; assert len(m['symbols'])==10; assert all(x['candles']>10000 for x in m['files']); print(json.dumps(m, indent=2))"
      - name: Run baseline replay
        run: >-
          python -m research.strategy_v2_replay
          --data data/historical
          --output short-edge-baseline
          --mode baseline
      - name: Run SHORT edge replay
        run: >-
          python -m research.strategy_v2_replay
          --data data/historical
          --output short-edge-candidate
          --mode short_edge
      - name: Compare baseline and candidate
        run: >-
          python -c "import json, math; b=json.load(open('short-edge-baseline/strategy_v2_report.json')); c=json.load(open('short-edge-candidate/strategy_v2_report.json')); br=b['result']; cr=c['result']; bm=b['diagnostics']['robustness_metrics']; cm=c['diagnostics']['robustness_metrics']; bmc=b['diagnostics']['bootstrap_monte_carlo']; cmc=c['diagnostics']['bootstrap_monte_carlo']; keys=('final_equity','pnl','return_pct','max_drawdown_pct','win_rate_pct','profit_factor'); assert b['strategy']=='V2' and c['strategy']=='V2-SHORT-EDGE'; assert all(math.isfinite(float(x)) for x in [br[k] for k in keys]+[cr[k] for k in keys]); assert all(math.isfinite(float(x)) for x in [bm[k] for k in ('sharpe_ratio','sortino_ratio','calmar_ratio','expectancy_per_trade','payoff_ratio','profit_factor')]+[cm[k] for k in ('sharpe_ratio','sortino_ratio','calmar_ratio','expectancy_per_trade','payoff_ratio','profit_factor')]); assert float(c['diagnostics']['short_edge_signals']) >= 0; assert float(cmc['p05_final_equity']) <= float(cmc['median_final_equity']) <= float(cmc['p95_final_equity']); print(json.dumps({'baseline':br,'candidate':cr,'baseline_metrics':bm,'candidate_metrics':cm,'baseline_bootstrap':bmc,'candidate_bootstrap':cmc}, indent=2))"
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v2-short-edge-benchmark
          path: |
            short-edge-baseline/
            short-edge-candidate/
