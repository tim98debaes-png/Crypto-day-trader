name: Trend Breakout Historical Benchmark

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Symbol
        required: true
        default: BTCUSDT
      interval:
        description: Candle interval
        required: true
        default: 1m
      start:
        description: Start date/time accepted by the Binance historical helper
        required: true
        default: '2026-05-01'
      end:
        description: End date/time accepted by the Binance historical helper
        required: true
        default: '2026-08-01'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy-implementation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run historical replay
        run: >-
          python research/run_trend_breakout_replay.py
          --symbol "${{ inputs.symbol }}"
          --interval "${{ inputs.interval }}"
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"
          --output research/results/trend_breakout_baseline.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: trend-breakout-${{ inputs.symbol }}-${{ inputs.interval }}
          path: research/results/trend_breakout_baseline.json
