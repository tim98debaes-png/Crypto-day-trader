name: Phase 4 robustness integration

on:
  push:
    branches:
      - phase-4-robustness-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Apply Phase 4 optimizer integration
        run: python scripts/apply_phase4_integration.py

      - name: Compile application
        run: python -m py_compile app.py validation_engine.py robustness_engine.py

      - name: Run Phase 4 tests
        run: pytest -q tests/test_phase4_robustness.py

      - name: Run Phase 3 regression tests
        run: pytest -q tests/test_phase3_validation.py

      - name: Commit integration when changed
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Phase 4: integrate robustness engine into optimizer"
          git push
