name: Run Phase 4 optimizer fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply_phase4_integration.py
      - name: Validate Phase 4
        run: |
          python -m pip install -r requirements.txt pytest
          python -m py_compile app.py robustness_engine.py
          python -m pytest -q tests/test_phase3_validation.py tests/test_phase4_robustness.py tests/test_phase4_integration_contract.py
      - name: Commit fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/run-phase4-fix.yml .github/workflows/apply-phase4-fix.yml scripts/apply_phase4_integration.py
          git add app.py
          git commit -m 'Fix Phase 4 optimizer integration'
          git push
