name: Scanner regression

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  scanner-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run multi-asset scanner regression tests
        run: python -m pytest -q tests/test_multi_asset_scanner.py
